<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo { font-size: 44px; margin-bottom: 12px; }
    .nombre { font-size: 21px; font-weight: 600; color: #1a1a2e; margin-bottom: 2px; }
    .subtitulo { font-size: 13px; color: #64748b; margin-bottom: 24px; }

    /* Panel de registro */
    #panelRegistro {}
    .label-tipo { font-size: 13px; color: #64748b; margin-bottom: 10px; }
    .btns-tipo { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-tipo {
      flex: 1;
      padding: 16px 8px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: white;
      color: #64748b;
      transition: all 0.15s;
    }
    .btn-tipo.entrada.activo { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; }
    .btn-tipo.salida.activo  { border-color: #534AB7; background: #EEEDFE; color: #26215C; }
    .btn-tipo:hover { border-color: #94a3b8; }
    .btn-registrar {
      width: 100%;
      padding: 16px;
      background: #94a3b8;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: not-allowed;
      transition: background 0.2s;
      margin-bottom: 12px;
    }
    .btn-registrar.listo { background: #1D9E75; cursor: pointer; }
    .btn-registrar.listo:active { background: #0F6E56; }
    .btn-correccion {
      width: 100%;
      padding: 11px;
      background: white;
      color: #94a3b8;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-correccion:hover { border-color: #94a3b8; color: #64748b; }

    /* Panel de corrección */
    #panelCorreccion { display: none; }
    .correccion-titulo { font-size: 15px; font-weight: 600; color: #1a1a2e; margin-bottom: 6px; }
    .correccion-sub { font-size: 13px; color: #64748b; margin-bottom: 16px; }
    .correccion-select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      color: #1a1a2e;
      margin-bottom: 10px;
      background: white;
    }
    .correccion-texto {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      color: #1a1a2e;
      margin-bottom: 14px;
      resize: none;
      height: 80px;
      font-family: inherit;
    }
    .correccion-texto:focus, .correccion-select:focus { outline: none; border-color: #1D9E75; }
    .btn-enviar-correccion {
      width: 100%;
      padding: 14px;
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-enviar-correccion:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-volver {
      width: 100%;
      padding: 10px;
      background: white;
      color: #94a3b8;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
    }

    /* Compartidos */
    .estado-geo {
      display: none;
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: left;
    }
    .estado-geo.buscando { background: #EFF6FF; color: #1D4ED8; }
    .estado-geo.ok       { background: #E1F5EE; color: #0F6E56; }
    .estado-geo.lejos    { background: #FCEBEB; color: #A32D2D; }
    .estado-geo.sin-perm { background: #FFF7ED; color: #854F0B; }
    .resultado {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      font-size: 15px;
    }
    .resultado.entrada  { background: #E1F5EE; color: #085041; }
    .resultado.salida   { background: #EEEDFE; color: #26215C; }
    .resultado.error    { background: #FCEBEB; color: #501313; }
    .resultado.correccion { background: #FFF7ED; color: #854F0B; }
    .tipo-label { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .detalle { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .cargando { display: none; margin-top: 14px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">&#127970;</div>
  <div class="nombre" id="nombreLabel">Cargando...</div>
  <div class="subtitulo">Sistema de Asistencia</div>

  <!-- Panel principal de registro -->
  <div id="panelRegistro">
    <div class="estado-geo" id="estadoGeo"></div>

    <div class="label-tipo">Selecciona el tipo de registro:</div>
    <div class="btns-tipo">
      <button class="btn-tipo entrada" id="btnEntrada" onclick="seleccionarTipo('Entrada')">
        &#128338; Entrada
      </button>
      <button class="btn-tipo salida" id="btnSalida" onclick="seleccionarTipo('Salida')">
        &#128075; Salida
      </button>
    </div>

    <button class="btn-registrar" id="btnRegistrar" onclick="iniciarRegistro()" disabled>
      REGISTRAR
    </button>

    <button class="btn-correccion" onclick="mostrarCorreccion()">
      Solicitar corrección de asistencia
    </button>

    <div class="cargando" id="cargando">Registrando...</div>
    <div class="resultado" id="resultado">
      <div class="tipo-label" id="tipoLabel"></div>
      <div id="horaLabel"></div>
      <div class="detalle" id="estadoLabel"></div>
    </div>
  </div>

  <!-- Panel de corrección -->
  <div id="panelCorreccion">
    <div class="correccion-titulo">Solicitud de corrección</div>
    <div class="correccion-sub">Completa el formulario y tu supervisor revisará la solicitud.</div>

    <select class="correccion-select" id="tipoCorreccion">
      <option value="">Selecciona el motivo...</option>
      <option value="Olvide marcar entrada">Olvidé marcar entrada</option>
      <option value="Olvide marcar salida">Olvidé marcar salida</option>
      <option value="Error en el registro">Error en el registro</option>
      <option value="Problema tecnico">Problema técnico</option>
      <option value="Otro">Otro</option>
    </select>

    <textarea class="correccion-texto" id="detalleCorreccion" placeholder="Describe brevemente lo que ocurrió..."></textarea>

    <button class="btn-enviar-correccion" id="btnEnviarCorreccion" onclick="enviarCorreccion()">
      Enviar solicitud
    </button>
    <button class="btn-volver" onclick="volverRegistro()">
      Volver
    </button>

    <div class="cargando" id="cargandoCorreccion">Enviando solicitud...</div>
    <div class="resultado" id="resultadoCorreccion">
      <div class="tipo-label" id="tipoLabelCorreccion"></div>
      <div id="horaLabelCorreccion"></div>
    </div>
  </div>
</div>

<script>
  var URL_SCRIPT = 'https://script.google.com/macros/s/AKfycby1b3Ev4Q8-YxvRQa8u0Qi_-MI9kU8S0MTlCb3wIG8Fe6vGHfTp93XBHKc1j_P5oUUt/exec';
  var INST_LAT   = -33.4361944;
  var INST_LNG   = -70.6488333;
  var INST_RADIO = 150;

  var params = new URLSearchParams(window.location.search);
  var NOMBRE = params.get('nombre') || '';
  var ID     = params.get('id')     || '';

  if (!NOMBRE || !ID) {
    document.getElementById('nombreLabel').textContent = 'QR invalido';
    document.getElementById('btnRegistrar').disabled = true;
  } else {
    document.getElementById('nombreLabel').textContent = NOMBRE;
  }

  var tipoSeleccionado = null;
  var watchId = null;

  function seleccionarTipo(tipo) {
    tipoSeleccionado = tipo;
    document.getElementById('btnEntrada').classList.toggle('activo', tipo === 'Entrada');
    document.getElementById('btnSalida').classList.toggle('activo', tipo === 'Salida');
    var btn = document.getElementById('btnRegistrar');
    btn.classList.add('listo');
    btn.disabled = false;
  }

  function iniciarRegistro() {
    if (!tipoSeleccionado) return;
    var btn = document.getElementById('btnRegistrar');
    btn.disabled = true;
    btn.classList.remove('listo');
    mostrarGeo('buscando', 'Activando GPS...');

    if (!navigator.geolocation) {
      enviarRegistro('sin_validar'); return;
    }

    watchId = navigator.geolocation.watchPosition(
      function(pos) {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
          mostrarGeo('buscando', 'Calculando distancia...');
          validarUbicacion(pos);
        }
      },
      function(err) {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        mostrarGeo('sin-perm', 'No se pudo acceder al GPS. El registro quedara pendiente de revision.');
        setTimeout(function() { enviarRegistro('sin_validar'); }, 2000);
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );
  }

  function validarUbicacion(pos) {
    var dist = calcularDistancia(pos.coords.latitude, pos.coords.longitude, INST_LAT, INST_LNG);
    if (dist <= INST_RADIO) {
      mostrarGeo('ok', 'Ubicacion verificada (' + Math.round(dist) + 'm del edificio)');
      enviarRegistro('verificada');
    } else {
      mostrarGeo('lejos', 'Estas fuera del rango permitido (' + Math.round(dist) + 'm). Debes estar dentro del edificio.');
      var btn = document.getElementById('btnRegistrar');
      btn.disabled = false;
      btn.classList.add('listo');
    }
  }

  function calcularDistancia(lat1, lng1, lat2, lng2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng/2) * Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function enviarRegistro(geoEstado) {
    document.getElementById('estadoGeo').style.display = 'none';
    document.getElementById('cargando').style.display = 'block';
    var url = URL_SCRIPT
      + '?accion=registrar'
      + '&nombre=' + encodeURIComponent(NOMBRE)
      + '&id='     + encodeURIComponent(ID)
      + '&tipo='   + encodeURIComponent(tipoSeleccionado)
      + '&geo='    + encodeURIComponent(geoEstado);
    fetch(url, { method: 'GET', redirect: 'follow' })
    .then(function(r) { return r.json(); })
    .then(function(data) { mostrarResultado(data); })
    .catch(function() { mostrarError(); });
  }

  function mostrarGeo(tipo, msg) {
    var el = document.getElementById('estadoGeo');
    el.className = 'estado-geo ' + tipo;
    el.textContent = msg;
    el.style.display = 'block';
  }

  function mostrarResultado(data) {
    document.getElementById('cargando').style.display = 'none';
    var div = document.getElementById('resultado');
    div.className = 'resultado ' + (data.tipo === 'Entrada' ? 'entrada' : 'salida');
    document.getElementById('tipoLabel').textContent = data.tipo === 'Entrada' ? 'Entrada registrada' : 'Salida registrada';
    document.getElementById('horaLabel').textContent = data.fecha + ' - ' + data.hora;
    document.getElementById('estadoLabel').textContent = data.estado !== 'Normal' ? data.estado : '';
    div.style.display = 'block';
  }

  function mostrarError() {
    document.getElementById('cargando').style.display = 'none';
    var div = document.getElementById('resultado');
    div.className = 'resultado error';
    document.getElementById('tipoLabel').textContent = 'Error';
    document.getElementById('horaLabel').textContent = 'No se pudo registrar. Intenta de nuevo.';
    document.getElementById('estadoLabel').textContent = '';
    div.style.display = 'block';
    var btn = document.getElementById('btnRegistrar');
    btn.disabled = false;
    btn.classList.add('listo');
  }

  function mostrarCorreccion() {
    document.getElementById('panelRegistro').style.display = 'none';
    document.getElementById('panelCorreccion').style.display = 'block';
  }

  function volverRegistro() {
    document.getElementById('panelCorreccion').style.display = 'none';
    document.getElementById('panelRegistro').style.display = 'block';
    document.getElementById('resultadoCorreccion').style.display = 'none';
    document.getElementById('cargandoCorreccion').style.display = 'none';
    document.getElementById('tipoCorreccion').value = '';
    document.getElementById('detalleCorreccion').value = '';
    var btn = document.getElementById('btnEnviarCorreccion');
    btn.disabled = false;
  }

  function enviarCorreccion() {
    var motivo  = document.getElementById('tipoCorreccion').value;
    var detalle = document.getElementById('detalleCorreccion').value.trim();
    if (!motivo) { alert('Por favor selecciona el motivo.'); return; }
    if (!detalle) { alert('Por favor describe lo que ocurrió.'); return; }

    var btn = document.getElementById('btnEnviarCorreccion');
    btn.disabled = true;
    document.getElementById('cargandoCorreccion').style.display = 'block';

    var url = URL_SCRIPT
      + '?accion=correccion'
      + '&nombre='  + encodeURIComponent(NOMBRE)
      + '&id='      + encodeURIComponent(ID)
      + '&motivo='  + encodeURIComponent(motivo)
      + '&detalle=' + encodeURIComponent(detalle);

    fetch(url, { method: 'GET', redirect: 'follow' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('cargandoCorreccion').style.display = 'none';
      var div = document.getElementById('resultadoCorreccion');
      div.className = 'resultado correccion';
      document.getElementById('tipoLabelCorreccion').textContent = 'Solicitud enviada';
      document.getElementById('horaLabelCorreccion').textContent = 'Tu supervisor revisara tu solicitud a la brevedad.';
      div.style.display = 'block';
    })
    .catch(function() {
      document.getElementById('cargandoCorreccion').style.display = 'none';
      alert('Error al enviar. Intenta de nuevo.');
      btn.disabled = false;
    });
  }
</script>
</body>
</html>
